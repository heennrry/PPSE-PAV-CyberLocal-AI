services:

  ollama:
    image: ollama/ollama:latest
    container_name: cyberlocal-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    container_name: cyberlocal-app
    depends_on:
      - ollama
    volumes:
      - ./documents:/documents
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - MODEL=dagbs/qwen2.5-coder-7b-instruct-abliterated:q4_k_m
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: cyberlocal-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  ollama_data:
